name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify required build secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=0
          if [ -z "${VITE_SUPABASE_URL}" ]; then
            echo "::error::Secret VITE_SUPABASE_URL is empty or not defined in repo secrets."
            missing=1
          fi
          if [ -z "${VITE_SUPABASE_PUBLISHABLE_KEY}" ]; then
            echo "::error::Secret VITE_SUPABASE_PUBLISHABLE_KEY is empty or not defined in repo secrets."
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "Without these secrets the Vite build inlines 'undefined' for the Supabase"
            echo "client and React fails to mount at runtime (blank #root on /auth)."
            echo "Define them in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Build secrets present. URL length=${#VITE_SUPABASE_URL}, KEY length=${#VITE_SUPABASE_PUBLISHABLE_KEY}."

      - name: Build app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Run E2E tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173
          # Credenciales del usuario de test consumidas por
          # e2e/global-setup.ts. Sin ellas la suite aborta con error claro.
          # Configurar en Settings → Secrets and variables → Actions.
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
