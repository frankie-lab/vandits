name: E2E Tests

# Suite Playwright. Requiere secrets de Supabase + credenciales del usuario
# sandbox. Si faltan, el workflow termina en VERDE con un warning (no es un
# fallo del código, es configuración de CI ausente). La señal verde fiable
# de regresión vive en `unit.yml` (vitest, sin secrets).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate de secrets ANTES de instalar Playwright para no malgastar minutos
      # cuando los secrets no están configurados. Termina en verde con warning.
      - name: Check E2E secrets availability
        id: secrets_gate
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          missing=()
          [ -z "${VITE_SUPABASE_URL}" ] && missing+=("VITE_SUPABASE_URL")
          [ -z "${VITE_SUPABASE_PUBLISHABLE_KEY}" ] && missing+=("VITE_SUPABASE_PUBLISHABLE_KEY")
          [ -z "${E2E_USER_EMAIL}" ] && missing+=("E2E_USER_EMAIL")
          [ -z "${E2E_USER_PASSWORD}" ] && missing+=("E2E_USER_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::E2E skipped — missing secrets: ${missing[*]}. Configure them in Settings → Secrets and variables → Actions to enable the Playwright suite."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "All E2E secrets present. URL length=${#VITE_SUPABASE_URL}, KEY length=${#VITE_SUPABASE_PUBLISHABLE_KEY}."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright browsers
        if: steps.secrets_gate.outputs.should_run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build app
        if: steps.secrets_gate.outputs.should_run == 'true'
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Ensure E2E fixture (sandbox user catalog has imported + empty POIs)
        # Garantiza que `sandbox-agent@vandits.test` tiene ≥1 POI por
        # cada `visualState` para que el contrato del selector
        # (count===0 && !active ⇒ disabled) no bloquee filas en la suite
        # camera-qa. Idempotente: usa IDs deterministas + upsert.
        # NO requiere service_role — autentica con anon key + password.
        if: steps.secrets_gate.outputs.should_run == 'true'
        run: npx --yes tsx scripts/e2e/ensure-test-fixture.ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Run E2E tests
        if: steps.secrets_gate.outputs.should_run == 'true'
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - uses: actions/upload-artifact@v4
        if: always() && steps.secrets_gate.outputs.should_run == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
