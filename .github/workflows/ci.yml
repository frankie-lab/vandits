name: CI

# PR-CI-INFRA-1 — Minimal CI gate for main.
#
# Política de gates (ajuste inicial — ver PR-CI-INFRA-1 nota de gate):
#   - typecheck  → BLOQUEANTE. Es el único gate "duro" hoy.
#   - lint       → DIAGNÓSTICO (continue-on-error). Main arrastra deuda
#                  histórica ESLint masiva; se endurecerá en PR-LINT-DEBT-1.
#                  No tocar src/ ni scripts/ para "limpiar" lint aquí.
#   - vitest     → DIAGNÓSTICO (continue-on-error). Main arrastra ~34 tests
#                  rojos por deuda histórica (contract tests desalineados
#                  con el canon actual). Se endurecerá en PR-VITEST-DEBT-1
#                  una vez auditados uno a uno (rojo ≠ se barre — se
#                  diagnostica: código rompió contrato vs canon cambió vs
#                  deuda real, ver mem://governance/engineering-discipline).
#
# Tokens build corre como prebuild vía npm scripts cuando aplica.

on:
  push:
    branches:
      - main
      - 'pr/**'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (tsc --noEmit) [blocking]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run tokens:build
      - run: npx tsc --noEmit -p tsconfig.app.json

  lint:
    name: Lint (eslint) [diagnostic — non-blocking]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run eslint (report only)
        run: npm run lint || true

  test:
    name: Vitest (unit + parity + contract) [diagnostic — non-blocking]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run tokens:build
      - name: Run vitest (report only)
        run: npm test || true
