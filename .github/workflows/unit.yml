name: Unit Tests

# Suite Vitest. No depende de secrets (no build, no Supabase, no Playwright).
# Sirve como señal verde fiable de regresión en cada push/PR. Las pruebas E2E
# viven en `.github/workflows/e2e.yml` y se ejecutan aparte (skip si faltan
# secrets de CI).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest suite
        run: npm test
